<!DOCTYPE html>
<html lang="en-ZA" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Mauwane Legacy Collective</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/404.css">
</head>
<body class="error-page">
    <!-- Simplified Header -->
    <header class="error-header">
        <div class="container">
            <a href="index.html" class="logo-link">
                <img src="assets/images/MLC-LOGO.png" alt="MLC Logo" width="120" height="40">
            </a>
        </div>
    </header>

    <!-- Error Content -->
    <main class="error-content">
        <div class="container">
            <div class="error-grid">
                <div class="error-text">
                    <h1>404</h1>
                    <h2>Page Not Found</h2>
                    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track:</p>
                    <div class="error-actions">
                        <a href="index.html" class="btn btn-primary">Return Home</a>
                        <a href="contact.html" class="btn btn-outline">Contact Us</a>
                    </div>
                </div>
                <div class="error-image">
                    <img src="assets/images/404-error.png" alt="Lost in craftsmanship" loading="lazy">
                </div>
            </div>
        </div>
    </main>

    <!-- Simplified Footer -->
    <footer class="error-footer">
        <div class="container">
            <p>&copy; 2023 Mauwane Legacy Collective. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
